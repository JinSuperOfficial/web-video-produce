<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>web-video-produce :: HTML + Canvas + GSAP 逐帧模板</title>
<!--
  帧协议（让 capture_frames.mjs / Remotion / 任何截图器都能拿到确定性画面）：
    ?frame=120&fps=30&duration=360
    1) 所有动画由 FRAME 推导，不用 requestAnimationFrame 累加时间
    2) 画完把 window.__FRAME_READY__ = true
    3) 不用 Math.random() / Date.now()
  预览: 直接用浏览器打开（默认第 0 帧），改 URL 的 frame 参数看任意一帧。
-->
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0; display: flex; flex-direction: column;
         align-items: center; justify-content: center; color: #eef2ff;
         font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .kicker { letter-spacing: 12px; font-size: 14px; color: #5eead4; font-weight: 700; }
  h1 { font-size: 96px; margin: 18px 0 0; font-weight: 900; letter-spacing: 4px; }
  .cards { position: absolute; left: 0; right: 0; bottom: 120px; display: flex;
           gap: 24px; justify-content: center; }
  .card { width: 260px; padding: 20px 24px; border-radius: 16px; color: #dbe4ff;
          background: rgba(255,255,255,.06); border: 1px solid rgba(94,234,212,.35);
          font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div class="hud">
    <div class="kicker">WEB · VIDEO · PRODUCE</div>
    <h1 id="title">写代码，做视频</h1>
  </div>
  <div class="cards" id="cards"></div>
</div>

<!-- 优先用本地 node_modules 里的 GSAP（离线渲染必须），失败再回退 CDN -->
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  if (!window.gsap) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"><\/script>');
  }
</script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const FPS = Number(q.get('fps') ?? 30);
  const FRAME = Number(q.get('frame') ?? 0);
  const DURATION = Number(q.get('duration') ?? FPS * 10);
  const T = FRAME / FPS;                    // 秒：一切动画的唯一时间来源
  const W = innerWidth, H = innerHeight;

  // ---------- 1. Canvas 2D 背景（确定性：只用 T，不用随机） ----------
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0a1020');
  g.addColorStop(1, '#05070f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 波浪线：第 i 条线的相位 = T * 速度 + i，完全可复现
  for (let i = 0; i < 46; i++) {
    const phase = T * 1.1 + i * 0.35;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y =
        H * 0.62 +
        Math.sin(x * 0.006 + phase) * 46 +
        Math.sin(x * 0.017 - phase * 0.7) * 18 +
        i * 3.2;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsla(${168 + i * 2.2}, 78%, ${52 + (i % 7) * 3}%, ${0.05 + (i % 5) * 0.035})`;
    ctx.lineWidth = 1 + (i % 3) * 0.6;
    ctx.stroke();
  }

  // 粒子：用整数哈希代替 Math.random()
  const rand = (n) => {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  };
  for (let i = 0; i < 120; i++) {
    const sx = rand(i) * W;
    const sy = (rand(i + 99) * H + T * (12 + rand(i + 7) * 40)) % H;
    const r = 0.6 + rand(i + 31) * 1.9;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(94,234,212,${0.12 + rand(i + 5) * 0.35})`;
    ctx.fill();
  }

  // ---------- 2. GSAP：paused 时间线 + seek，唯一正确的确定性用法 ----------
  const cards = document.getElementById('cards');
  ['Canvas 2D', 'Three.js + GLSL', 'Remotion', 'FFmpeg'].forEach((t) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.textContent = '> ' + t;
    cards.appendChild(d);
  });

  const tl = gsap.timeline({ paused: true });
  tl.from('#title', { y: 70, opacity: 0, letterSpacing: '26px', duration: 0.9, ease: 'power3.out' }, 0)
    .from('.kicker', { opacity: 0, duration: 0.6 }, 0.2)
    .from('.card', { y: 90, opacity: 0, duration: 0.7, ease: 'back.out(1.5)', stagger: 0.14 }, 0.5)
    .to('.card', { y: -12, duration: 1.2, ease: 'sine.inOut', stagger: 0.1 }, 1.8)
    .to('.card', { y: 0, duration: 1.2, ease: 'sine.inOut', stagger: 0.1 }, 3.0);

  tl.seek(Math.min(T, tl.duration()), false);   // ← 关键：只 seek，不让 GSAP 自己走时间

  // ---------- 3. 通知截图器 ----------
  window.__FRAME_READY__ = true;
})();
</script>
</body>
</html>
